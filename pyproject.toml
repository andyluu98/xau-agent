[project]
name = "xau-agent"
version = "0.1.0"
description = "Semi-auto AI agent for XAUUSD M15 scalp on MT5 with H1/H4 trend filter, DeepSeek reasoning, Tavily news"
requires-python = ">=3.11"
dependencies = [
    "MetaTrader5>=5.0.45",
    "pandas>=2.2.0",
    "pandas-ta>=0.3.14b0",
    "numpy>=2.2.6",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "tenacity>=8.2.0",
    "tradingview-ta>=3.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
xau-agent = "xau_agent.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xau_agent"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
